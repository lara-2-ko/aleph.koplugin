name: Bug report
description: Something in Aleph doesn't work or looks wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! The more of these you fill in, the faster it can be fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
      placeholder: When I change the font size in night mode, the page turns white…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps that make it happen, one per line.
      placeholder: |
        1. Open a book
        2. Turn on night mode
        3. Change the font size
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Kindle Paperwhite (12th gen), Kobo Libra Colour…
    validations:
      required: true
  - type: input
    id: koreader
    attributes:
      label: KOReader version
      description: Top menu → ☰ → Help → About
      placeholder: "2026.07.1"
    validations:
      required: true
  - type: input
    id: aleph
    attributes:
      label: Aleph version
      description: Aleph → Menu → Settings → About
      placeholder: "1.0.1"
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Other plugins or patches
      description: Plugins or user patches that change menus, highlights or the reader (for example ZenUI, Bookends, Bookshelf, Quick Top Bar). Leave empty if none.
  - type: textarea
    id: log
    attributes:
      label: crash.log
      description: |
        Attach `koreader/crash.log` (drag the file in), or paste the lines around the problem. Aleph's lines start with "Aleph:".
        Please check it for anything private first (book titles, folder names, Wi-Fi names).
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or photos
      description: Drag images in here if they help show the problem.
